  <main>
    <section class="hero" id="top">
      <canvas class="hero-wave" id="wave" aria-hidden="true"></canvas>
      <div class="hero-inner wrap">
        <h1 class="hero-title" id="headline">Interactive Audio, Programming &amp; Sound Design for Games</h1>
        <p class="hero-intro" id="intro">Lead Audio at <a href="https://www.g4f-prod.com/" target="_blank" rel="noopener">G4F Prod</a></p>
      </div>
    </section>

    <section class="section" id="work">
      <div class="wrap">
        <div class="section-head">
          <h2><span data-ui="nav.work">work</span></h2>
          <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
        </div>
        <ul class="grid" id="grid"></ul>
      </div>
    </section>

    <section class="section" id="about">
      <div class="wrap">
        <div class="section-head"><h2><span data-ui="nav.about">about</span></h2></div>
        <div class="about">
          <div class="about-body">
            <div class="prose about-text" id="aboutText"></div>
            <div class="news" id="newsBlock">
              <h3 data-ui="news">news</h3>
              <ul id="news"></ul>
            </div>
          </div>
        </div>
        <div class="skills" id="skills"></div>
        <h3 data-ui="cv">cv</h3>
        <a class="text-link" id="resume" href="#" target="_blank" rel="noopener"><span data-ui="resume">download my resume</span></a>
        <p class="resume-soon" id="resumeSoon" data-ui="resumeSoon" hidden>coming soon</p>
      </div>
    </section>

    <section class="section" id="credits">
      <div class="wrap">
        <div class="section-head"><h2><span data-ui="nav.credits">credits</span></h2></div>
        <div class="credits" id="creditsList"></div>
        <h3 class="awards-title" data-ui="awards">awards</h3>
        <ul class="awards" id="awards"></ul>
      </div>
    </section>

    <section class="section contact" id="contact">
      <div class="wrap">
        <div class="section-head"><h2><span data-ui="contactTitle">contact</span></h2></div>
        <form class="contact-form" id="contactForm" novalidate>
          <div class="field">
            <label for="cfName" data-ui="formName">name</label>
            <input id="cfName" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="cfEmail" data-ui="formEmail">email</label>
            <input id="cfEmail" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="cfMessage" data-ui="formMessage">message</label>
            <textarea id="cfMessage" name="message" rows="6" required></textarea>
          </div>
          <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div class="form-foot">
            <button class="form-send" type="submit" data-ui="formSend">send</button>
            <p class="form-status" id="cfStatus" role="status" aria-live="polite"></p>
          </div>
        </form>
        <div id="contactBody"></div>
      </div>
    </section>
    <!-- Mentions légales : affichées seulement quand on clique sur le lien du pied de page (#legal) -->

      <div class="wrap">
        <div class="section-head"><h2><span data-ui="legal">legal notice</span></h2></div>
        <div class="prose legal-text" id="legalText"></div>
      </div>

  <!-- Fiche projet -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">
      <div class="modal-bar">
        <button type="button" class="icon-btn" id="mPrev" aria-label="Previous project">←</button>
        <span class="modal-count" id="mCount"></span>
        <button type="button" class="icon-btn" id="mNext" aria-label="Next project">→</button>
        <button type="button" class="icon-btn close" data-close aria-label="Close">✕</button>
      </div>
      <div class="modal-content">
        <div class="viewer">
          <div class="stage" id="mStage"></div>
          <p class="stage-caption" id="mCaption"></p>
          <ul class="thumbs" id="mThumbs"></ul>
          <div class="audio-list" id="mAudio"></div>
        </div>
        <div class="info">
          <h2 class="info-title" id="mTitle"></h2>
          <dl class="info-facts" id="mFacts"></dl>
          <div class="info-actions" id="mActions"></div>
          <div class="prose" id="mText"></div>
        </div>
      </div>
    </article>
